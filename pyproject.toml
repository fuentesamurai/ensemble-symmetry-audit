[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-symmetry-audit"
version = "0.5.0"
description = "Property-based audit of voting ensemble aggregators. First-class adapters for sklearn, XGBoost, LightGBM. Hard + soft voting with statistical tests."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Diego de la Fuente"}]
requires-python = ">=3.10"
keywords = [
    "ensemble",
    "voting",
    "soft-voting",
    "social-choice",
    "property-testing",
    "hypothesis",
    "machine-learning",
    "quant",
    "classifier",
    "arrow-theorem",
    "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "scipy>=1.10",
    "numpy>=1.20",
]

[project.optional-dependencies]
shrink = ["hypothesis>=6.90"]
sklearn = ["scikit-learn>=1.3"]
xgboost = ["xgboost>=1.7"]
lightgbm = ["lightgbm>=4.0"]
adapters = ["scikit-learn>=1.3", "xgboost>=1.7", "lightgbm>=4.0"]
dev = [
    "pytest>=7.0",
    "scikit-learn>=1.3",
    "hypothesis>=6.90",
]

[project.urls]
Homepage = "https://github.com/fuentesamurai/ensemble-symmetry-audit"
Repository = "https://github.com/fuentesamurai/ensemble-symmetry-audit"

[tool.setuptools.packages.find]
where = ["src"]
