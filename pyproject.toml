[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-symmetry-audit"
version = "0.2.0"
description = "Property-based audit of voting ensemble aggregators. Catches structural asymmetries (Pareto, IIA, monotonicity, flip invariance, permutation invariance, tie-break determinism) that unit tests miss."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Diego de la Fuente"}]
requires-python = ">=3.10"
keywords = [
    "ensemble",
    "voting",
    "social-choice",
    "property-testing",
    "machine-learning",
    "quant",
    "classifier",
    "arrow-theorem",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/fuentesamurai/ensemble-symmetry-audit"
Repository = "https://github.com/fuentesamurai/ensemble-symmetry-audit"

[tool.setuptools.packages.find]
where = ["src"]
